<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>テストメモ（Y方式）</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../../icons/memo-192.png">
<meta name="theme-color" content="#c2571a">
<link rel="stylesheet" href="../../../common/style.css">
<script src="../../../common/sanei.js"></script>
<style>header{background:#c2571a}</style>
</head>
<body>
<header>
  <h1>テストメモ <span class="ver" id="ver"></span></h1>
  <button class="chip" id="installBtn" hidden>このツールを単独でインストール</button>
  <span class="chip" id="who"></span>
</header>
<main>
  <div class="card">
    <h2>メモ（保存名 memo.data。このPCのChromeにだけ保存）</h2>
    <textarea id="text" rows="6" style="width:100%"></textarea>
    <p><button id="save">保存</button> <span id="last" class="note"></span></p>
    <p class="note">本番の共有データ（GAS）でも、保存するときに利用者名を添えて「誰が更新したか」を残す想定です。</p>
  </div>
  <p><a class="btn sub" href="../../portal/" target="_blank">ポータルを開く</a></p>
  <div class="diag" id="diag"></div>
</main>
<script>
var VERSION = 'v3';
var TOOL_ID = 'memo';
document.getElementById('ver').textContent = VERSION;
var mk = TOOL_ID + '.data';
function load() { try { return JSON.parse(localStorage.getItem(mk)) || {}; } catch (e) { return {}; } }
document.getElementById('save').onclick = function () {
  var u = Sanei.getUser();
  if (!u) { alert('ポータルで名前を選んでから保存してください'); return; }
  var d = { text: document.getElementById('text').value, by: u.name, at: new Date().toLocaleString('ja-JP') };
  try { localStorage.setItem(mk, JSON.stringify(d)); } catch (e) {}
  refresh();
};

var deferred = null;
addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; document.getElementById('installBtn').hidden = false; });
document.getElementById('installBtn').onclick = function () { if (deferred) { deferred.prompt(); deferred = null; } };

function refresh() {
  var u = Sanei.getUser(), d = load();
  document.getElementById('who').textContent = u ? '利用者：' + u.name : '利用者：未選択（ポータルで選んでください）';
  if (document.activeElement !== document.getElementById('text')) document.getElementById('text').value = d.text || '';
  document.getElementById('last').textContent = d.by ? '最終更新：' + d.by + '（' + d.at + '）' : 'まだ保存されていません';
  Sanei.renderDiag(document.getElementById('diag'), [['版', VERSION]]);
}
Sanei.onChange(refresh);
addEventListener('storage', function (e) { if (e.key === mk) refresh(); });
refresh();
</script>
</body>
</html>
